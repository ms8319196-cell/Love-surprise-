<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Love ❤️</title>

<style>

body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

#login {
    margin-top: 35vh;
}

h1 {
    color: #ff9acb;
}

input {
    width: 220px;
    padding: 13px;
    border: none;
    border-radius: 25px;
    text-align: center;
    font-size: 16px;
    outline: none;
}

button {
    margin-top: 15px;
    padding: 13px 28px;
    border: none;
    border-radius: 25px;
    background: #ff9acb;
    color: black;
    font-size: 16px;
    font-weight: bold;
}

#heart {
    display: none;
    position: relative;
    width: 100vw;
    height: 100vh;
}

.love {
    position: absolute;
    color: #ff9acb;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;

    opacity: 0;
    animation: appear 0.8s forwards;
}

@keyframes appear {

    0% {
        opacity: 0;
        transform: scale(0);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}

</style>
</head>

<body>

<div id="login">

    <h1>💌 A Little Surprise For You 💌</h1>

    <p>Enter the secret keyword ❤️</p>

    <input
        id="keyword"
        type="text"
        placeholder="Secret keyword"
    >

    <br>

    <button onclick="startLove()">
        Open Surprise 💗
    </button>

</div>


<div id="heart"></div>


<script>

function startLove() {

    let keyword =
        document.getElementById("keyword").value
        .trim()
        .toUpperCase();

    if (keyword !== "ILOVEYOU") {

        alert("Wrong keyword ❤️");

        return;
    }

    document.getElementById("login").style.display = "none";

    document.getElementById("heart").style.display = "block";

    makeHeart();
}


function makeHeart() {

    let heart =
        document.getElementById("heart");

    /*
       Heart equation
    */

    let points = [];

    for (let t = 0; t < Math.PI * 2; t += 0.08) {

        let x =
            16 * Math.pow(Math.sin(t), 3);

        let y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        points.push({
            x: x,
            y: y
        });
    }


    /*
       Create many I LOVE YOU
       words around the heart
    */

    let count = 150;

    for (let i = 0; i < count; i++) {

        let point =
            points[i % points.length];

        let love =
            document.createElement("div");

        love.className = "love";

        love.innerHTML = "I LOVE YOU";


        /*
           Small random movement
           makes the heart look fuller
        */

        let randomX =
            (Math.random() - 0.5) * 4;

        let randomY =
            (Math.random() - 0.5) * 4;


        love.style.left =
            (50 + point.x * 2.2 + randomX) + "%";

        love.style.top =
            (45 - point.y * 2.2 + randomY) + "%";


        love.style.animationDelay =
            (i * 0.035) + "s";


        heart.appendChild(love);
    }

}

</script>

</body>
</html>
