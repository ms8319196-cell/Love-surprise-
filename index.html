<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Surprise ❤️</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

#login {
    margin-top: 35vh;
}

h1 {
    color: pink;
}

input {
    padding: 12px;
    width: 220px;
    border: none;
    border-radius: 25px;
    text-align: center;
    font-size: 16px;
}

button {
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: pink;
    color: black;
    font-size: 16px;
}

#heart {
    display: none;
    position: relative;
    width: 100vw;
    height: 100vh;
}

.love {
    position: absolute;
    color: #ff9ecf;
    font-size: 13px;
    font-weight: bold;
    animation: show 1s forwards;
    opacity: 0;
}

@keyframes show {
    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}
</style>
</head>

<body>

<div id="login">

    <h1>💌 My Secret Surprise 💌</h1>

    <p>Enter the secret keyword ❤️</p>

    <input
        id="keyword"
        type="text"
        placeholder="Enter keyword"
    >

    <br>

    <button onclick="openSurprise()">
        Open ❤️
    </button>

</div>


<div id="heart">

    <h1>I LOVE YOU ❤️</h1>

</div>


<script>

function openSurprise() {

    let keyword =
        document.getElementById("keyword").value
        .trim()
        .toUpperCase();

    if (keyword !== "ILOVEYOU") {

        alert("Wrong keyword 😜");

        return;
    }

    document.getElementById("login").style.display = "none";

    document.getElementById("heart").style.display = "block";

    createHeart();
}


function createHeart() {

    let heart = document.getElementById("heart");

    for (let i = 0; i < 100; i++) {

        let t =
            (Math.PI * 2 * i) / 100;

        let x =
            16 * Math.pow(Math.sin(t), 3);

        let y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        let text =
            document.createElement("div");

        text.className = "love";

        text.innerHTML = "I LOVE YOU";

        text.style.left =
            (50 + x * 2.3) + "%";

        text.style.top =
            (45 - y * 2.3) + "%";

        text.style.animationDelay =
            (i * 0.04) + "s";

        heart.appendChild(text);
    }
}

</script>

</body>
</html>
